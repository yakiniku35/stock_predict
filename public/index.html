<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #06080d;
            --panel: rgba(15, 23, 42, 0.74);
            --panel-strong: rgba(9, 16, 29, 0.92);
            --line: rgba(148, 163, 184, 0.15);
            --line-hot: rgba(45, 212, 191, 0.42);
            --text: #f8fafc;
            --muted: #94a3b8;
            --soft: #cbd5e1;
            --cyan: #22d3ee;
            --blue: #3b82f6;
            --mint: #2dd4bf;
            --amber: #f59e0b;
            --red: #f43f5e;
            --green: #10b981;
        }
        
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background:
                linear-gradient(135deg, rgba(34, 211, 238, 0.08) 0 1px, transparent 1px 16px),
                radial-gradient(circle at 12% -8%, rgba(45, 212, 191, 0.22), transparent 28rem),
                radial-gradient(circle at 92% 3%, rgba(245, 158, 11, 0.11), transparent 24rem),
                linear-gradient(180deg, #0a1020 0%, var(--bg) 54%, #040508 100%);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .header {
            background: rgba(6, 10, 18, 0.76);
            border-bottom: 1px solid var(--line);
            padding: 0.85rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(22px);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 750;
            letter-spacing: 0;
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .logo::before {
            content: '';
            width: 0.7rem;
            height: 1.6rem;
            border-radius: 99px;
            background: linear-gradient(180deg, var(--mint), var(--blue));
            box-shadow: 0 0 26px rgba(34, 211, 238, 0.5);
        }
        
        .container {
            max-width: 1480px;
            margin: 0 auto;
            padding: 1.2rem 2rem 2rem;
        }

        .command-strip {
            display: grid;
            grid-template-columns: minmax(280px, 0.82fr) minmax(320px, 1fr);
            gap: 0.9rem;
            align-items: start;
            margin-bottom: 1rem;
        }
        
        .search-bar {
            background:
                linear-gradient(145deg, rgba(15, 23, 42, 0.86), rgba(2, 6, 23, 0.72)),
                radial-gradient(circle at 0 0, rgba(34, 211, 238, 0.18), transparent 10rem);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.72rem;
            display: grid;
            grid-template-columns: 1.4fr 0.7fr 0.7fr auto;
            gap: 0.72rem;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(18px);
        }
        
        input, select, button {
            background: rgba(2, 6, 23, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 0;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12);
        }
        
        button {
            background: linear-gradient(135deg, #2563eb, #0891b2 60%, #0f766e);
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: filter 0.2s, transform 0.2s;
        }
        
        button:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 0.82fr 1.18fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .metric-rail {
            display: grid;
            grid-template-columns: minmax(220px, 1.1fr) minmax(150px, 0.7fr) minmax(116px, 0.5fr);
            align-items: stretch;
            gap: 0.62rem;
        }
        
        .card {
            background:
                linear-gradient(145deg, rgba(15, 23, 42, 0.94), rgba(8, 16, 28, 0.86)),
                radial-gradient(circle at 86% 12%, rgba(34, 211, 238, 0.14), transparent 8rem);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.78rem 0.88rem;
            min-height: 88px;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24);
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: auto 0 0 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--line-hot), transparent);
            opacity: 0.55;
        }

        .metric-price {
            min-height: 118px;
            transform: translateY(0.35rem);
        }

        .metric-sentiment {
            min-height: 92px;
            transform: translateY(-0.15rem);
        }

        .metric-rsi {
            min-height: 80px;
            transform: translateY(1.15rem);
            background:
                linear-gradient(145deg, rgba(28, 19, 8, 0.92), rgba(8, 16, 28, 0.86)),
                radial-gradient(circle at 100% 0, rgba(245, 158, 11, 0.14), transparent 7rem);
        }
        
        .card-title {
            font-size: 0.64rem;
            color: var(--muted);
            margin-bottom: 0.28rem;
            text-transform: uppercase;
            letter-spacing: 0;
        }
        
        .card-value {
            font-size: clamp(1.35rem, 1.7vw, 1.7rem);
            font-weight: 700;
            margin-bottom: 0.2rem;
            line-height: 1.05;
            font-variant-numeric: tabular-nums;
        }

        .metric-price .card-value {
            font-size: clamp(1.85rem, 2.4vw, 2.45rem);
        }
        
        .card-change {
            font-size: 0.78rem;
            font-variant-numeric: tabular-nums;
        }

        .detail-list {
            margin-top: 0.42rem;
            font-size: 0.7rem;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 0.32rem 0.56rem;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1.08fr 0.92fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.55rem 0.85rem;
            font-size: 0.85rem;
            color: #d1d5db;
        }

        .overview-grid .label {
            color: var(--muted);
            margin-right: 0.25rem;
        }

        .training-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
        }

        .dot.running { background: #f59e0b; }
        .dot.done { background: #10b981; }

        .horizon-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .horizon-tab {
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(2, 6, 23, 0.64);
            color: #cbd5e1;
            border-radius: 6px;
            padding: 0.35rem 0.7rem;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .horizon-tab.active {
            border-color: var(--cyan);
            background: rgba(8, 47, 73, 0.88);
            color: #7dd3fc;
        }

        .model-list {
            display: grid;
            gap: 0.5rem;
        }

        .model-row {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr 0.6fr;
            gap: 0.5rem;
            padding: 0.58rem 0.65rem;
            border-left: 3px solid rgba(148, 163, 184, 0.24);
            background: rgba(2, 6, 23, 0.5);
            border-radius: 0 7px 7px 0;
            font-size: 0.82rem;
        }

        .model-row.best { border-left-color: #f59e0b; }

        .model-name { color: #e2e8f0; font-weight: 600; }
        .model-price { color: #93c5fd; text-align: right; font-variant-numeric: tabular-nums; }
        .model-change { text-align: right; font-variant-numeric: tabular-nums; }
        
        .positive { color: var(--green); }
        .negative { color: var(--red); }
        
        .chart-card {
            background:
                linear-gradient(145deg, rgba(15, 23, 42, 0.86), rgba(5, 10, 19, 0.82)),
                radial-gradient(circle at 100% 0, rgba(59, 130, 246, 0.1), transparent 18rem);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(14px);
        }

        .market-stage {
            position: relative;
            padding-top: 1.05rem;
        }

        .market-stage::before {
            content: '';
            position: absolute;
            top: 0;
            left: 1rem;
            right: 18%;
            height: 2px;
            background: linear-gradient(90deg, var(--cyan), transparent);
            opacity: 0.82;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.14);
            gap: 1rem;
        }
        
        .chart-title {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .chart-subtitle {
            color: var(--muted);
            font-size: 0.78rem;
            margin-top: 0.2rem;
        }

        .chart-options {
            display: grid;
            gap: 0.5rem;
            justify-items: end;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .option-label {
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 600;
        }
        
        .tabs {
            display: flex;
            gap: 0.5rem;
        }
        
        .tab {
            padding: 0.5rem 1rem;
            background: #07111f;
            border: 1px solid #25364a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
        }
        
        .tab.active {
            background: var(--cyan);
            border-color: var(--cyan);
        }

        .indicator-toggle {
            min-height: 32px;
            padding: 0.38rem 0.72rem;
            background: rgba(2, 6, 23, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.78rem;
            color: #cbd5e1;
            transition: all 0.2s;
        }

        .indicator-toggle.active {
            background: #164e63;
            border-color: var(--cyan);
            color: #ecfeff;
            box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.12) inset;
        }

        .subcharts-area {
            margin-top: 0.9rem;
            display: grid;
            gap: 0.75rem;
        }

        .subchart-item {
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 8px;
            padding: 0.5rem;
            background: rgba(2, 6, 23, 0.56);
        }

        .subchart-title {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.35rem;
        }
        
        .news-item {
            padding: 0.88rem 0.9rem;
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-left: 3px solid rgba(34, 211, 238, 0.34);
            border-radius: 8px;
            margin-bottom: 0.55rem;
            background: rgba(2, 6, 23, 0.42);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s, border-color 0.2s;
        }
        
        .news-item:hover {
            background: rgba(15, 23, 42, 0.86);
            border-color: rgba(34, 211, 238, 0.36);
            transform: translateX(3px);
        }
        
        .news-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #e5edf8;
        }
        
        .news-meta {
            font-size: 0.875rem;
            color: var(--muted);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge.pos { background: rgba(16, 185, 129, 0.12); color: var(--green); }
        .badge.neu { background: rgba(148, 163, 184, 0.12); color: var(--muted); }
        .badge.neg { background: rgba(244, 63, 94, 0.12); color: var(--red); }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading.active { display: flex; }
        
        .spinner {
            border: 3px solid #333;
            border-top-color: #0ea5e9;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 1040px) {
            .command-strip {
                grid-template-columns: 1fr;
            }

            .metric-rail {
                max-width: 760px;
            }

            .grid-2,
            .two-col {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            html,
            body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .header {
                padding: 0.9rem 1rem;
            }

            .header > div:last-child {
                display: none;
            }

            .container {
                padding: 1rem;
                width: 100%;
                max-width: 100vw;
                overflow-x: hidden;
            }

            .command-strip,
            .metric-rail,
            .search-bar,
            .card,
            .chart-card {
                min-width: 0;
                width: 100%;
                max-width: 100%;
            }

            .grid-2, .metric-rail, .command-strip, .two-col { grid-template-columns: 1fr; }
            .search-bar { grid-template-columns: 1fr; }
            .metric-price,
            .metric-sentiment,
            .metric-rsi {
                transform: none;
            }
            .search-bar input,
            .search-bar select,
            .search-bar button {
                width: 100%;
            }
            .chart-header { display: grid; }
            .chart-options { justify-items: stretch; }
            .option-group {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                justify-content: stretch;
                gap: 0.45rem;
            }
            .option-label {
                grid-column: 1 / -1;
            }
            .indicator-toggle {
                width: 100%;
                padding: 0.38rem 0.35rem;
                font-size: 0.72rem;
            }
            #mainChart {
                width: 100% !important;
                height: 520px !important;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">StockSense</div>
        <div style="font-size: 0.875rem; color: #888;">即時股票分析</div>
    </div>

    <div class="container">
        <div class="command-strip">
            <div class="search-bar">
                <input type="text" id="ticker" placeholder="股票代碼 (例: 2330, AAPL)" value="2330">
                <select id="period">
                    <option value="1d">1天</option>
                    <option value="5d">5天</option>
                    <option value="1mo">1個月</option>
                    <option value="3mo">3個月</option>
                    <option value="6mo">6個月</option>
                    <option value="1y" selected>1年</option>
                </select>
                <select id="interval">
                    <option value="5m">5m</option>
                    <option value="15m">15m</option>
                    <option value="1h">1H</option>
                    <option value="1d" selected>1D</option>
                    <option value="1wk">1W</option>
                    <option value="1mo">1M</option>
                </select>
                <button onclick="analyze()" id="btn">分析</button>
            </div>

            <div class="metric-rail">
                <div class="card metric-price">
                    <div class="card-title">最新價格與漲跌</div>
                    <div class="card-value" id="price">--</div>
                    <div class="card-change" id="priceChange">--</div>
                    <div class="detail-list" id="priceDetail">--</div>
                </div>
                <div class="card metric-sentiment">
                    <div class="card-title">新聞情緒</div>
                    <div class="card-value" id="sentiment">--</div>
                    <div class="card-change" id="sentimentText">--</div>
                </div>
                <div class="card metric-rsi">
                    <div class="card-title">RSI</div>
                    <div class="card-value" id="rsi">--</div>
                    <div class="card-change" id="rsiText">--</div>
                </div>
            </div>
        </div>

        <div class="chart-card market-stage">
            <div class="chart-header">
                <div>
                    <div class="chart-title">歷史價格與指標 <span id="chartRangeLabel">(1Y · 1D)</span></div>
                    <div class="chart-subtitle">預設僅顯示股票價格，指標可依需要開啟</div>
                </div>
                <div class="chart-options">
                    <div class="option-group">
                        <span class="option-label">價格圖選項</span>
                        <button class="indicator-toggle" data-overlay="ma">均線</button>
                        <button class="indicator-toggle" data-overlay="bb">布林通道</button>
                        <button class="indicator-toggle" data-overlay="forecast">預測線</button>
                    </div>
                    <div class="option-group">
                        <span class="option-label">副指標</span>
                        <button class="indicator-toggle" data-subchart="macd">MACD</button>
                        <button class="indicator-toggle" data-subchart="rsi">RSI</button>
                        <button class="indicator-toggle" data-subchart="kd">KD</button>
                        <button class="indicator-toggle" data-subchart="bias">BIAS</button>
                        <button class="indicator-toggle" data-subchart="ad">AD</button>
                    </div>
                </div>
            </div>
            <div id="mainChart" style="height: 620px;"></div>
            <div id="subChartsArea" class="subcharts-area" style="display: none;"></div>
        </div>

        <div class="two-col">
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">Company Overview</div>
                </div>
                <div class="overview-grid" id="companyOverview">
                    <div><span class="label">載入中:</span> --</div>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">ML Predictions</div>
                </div>
                <div class="training-row">
                    <div id="trainingStatus"><span class="dot running"></span>Training...</div>
                    <div id="forecastPrice">--</div>
                </div>
                <div class="horizon-tabs" id="horizonTabs">
                    <button class="horizon-tab active" data-days="7">7 Days</button>
                    <button class="horizon-tab" data-days="14">14 Days</button>
                    <button class="horizon-tab" data-days="30">30 Days</button>
                </div>
                <div class="model-list" id="modelList"></div>
            </div>
        </div>

        <div class="grid-2">
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">技術指標熱力圖 (漲跌週期)</div>
                </div>
                <div id="indChart" style="height: 300px;"></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">新聞動態</div>
                </div>
                <div id="newsList" style="max-height: 300px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div style="text-align: center;">
            <div class="spinner"></div>
            <div style="margin-top: 1rem;">分析中...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

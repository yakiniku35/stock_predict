<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #000;
            color: #fff;
            line-height: 1.5;
        }
        
        .header {
            background: #111;
            border-bottom: 1px solid #222;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo { font-size: 1.5rem; font-weight: 700; }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .search-bar {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 1rem;
        }
        
        input, select, button {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #0ea5e9;
        }
        
        button {
            background: #0ea5e9;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        button:hover { background: #0284c7; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 1.5rem;
        }
        
        .card-title {
            font-size: 0.875rem;
            color: #888;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .card-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        .card-change {
            font-size: 0.875rem;
        }

        .detail-list {
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: #9ca3af;
            display: grid;
            gap: 0.25rem;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem 1rem;
            font-size: 0.85rem;
            color: #d1d5db;
        }

        .overview-grid .label {
            color: #94a3b8;
            margin-right: 0.25rem;
        }

        .training-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
        }

        .dot.running { background: #f59e0b; }
        .dot.done { background: #10b981; }

        .horizon-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .horizon-tab {
            border: 1px solid #334155;
            background: #0b1220;
            color: #cbd5e1;
            border-radius: 6px;
            padding: 0.35rem 0.7rem;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .horizon-tab.active {
            border-color: #0ea5e9;
            background: #082f49;
            color: #7dd3fc;
        }

        .model-list {
            display: grid;
            gap: 0.5rem;
        }

        .model-row {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr 0.6fr;
            gap: 0.5rem;
            padding: 0.5rem;
            border-left: 3px solid #334155;
            background: #0b1220;
            font-size: 0.82rem;
        }

        .model-row.best { border-left-color: #f59e0b; }

        .model-name { color: #e2e8f0; font-weight: 600; }
        .model-price { color: #93c5fd; text-align: right; font-variant-numeric: tabular-nums; }
        .model-change { text-align: right; font-variant-numeric: tabular-nums; }
        
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        
        .chart-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #222;
        }
        
        .chart-title {
            font-size: 1.125rem;
            font-weight: 600;
        }
        
        .tabs {
            display: flex;
            gap: 0.5rem;
        }
        
        .tab {
            padding: 0.5rem 1rem;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
        }
        
        .tab.active {
            background: #0ea5e9;
            border-color: #0ea5e9;
        }

        .indicator-toggle {
            padding: 0.4rem 0.75rem;
            background: #000;
            border: 1px solid #334155;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.78rem;
            color: #cbd5e1;
            transition: all 0.2s;
        }

        .indicator-toggle.active {
            background: #082f49;
            border-color: #0ea5e9;
            color: #7dd3fc;
        }

        .subcharts-area {
            margin-top: 0.9rem;
            display: grid;
            gap: 0.75rem;
        }

        .subchart-item {
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 0.5rem;
            background: #0b1220;
        }

        .subchart-title {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 0.35rem;
        }
        
        .news-item {
            padding: 1rem;
            border-bottom: 1px solid #222;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .news-item:hover {
            background: #0a0a0a;
        }
        
        .news-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .news-meta {
            font-size: 0.875rem;
            color: #888;
            display: flex;
            gap: 1rem;
        }
        
        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge.pos { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge.neu { background: rgba(136, 136, 136, 0.1); color: #888; }
        .badge.neg { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading.active { display: flex; }
        
        .spinner {
            border: 3px solid #333;
            border-top-color: #0ea5e9;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .search-bar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">StockSense</div>
        <div style="font-size: 0.875rem; color: #888;">即時股票分析</div>
    </div>

    <div class="container">
        <div class="search-bar">
            <input type="text" id="ticker" placeholder="股票代碼 (例: 2330, AAPL)" value="2330">
            <select id="period">
                <option value="1mo">1個月</option>
                <option value="3mo">3個月</option>
                <option value="6mo">6個月</option>
                <option value="1y" selected>1年</option>
            </select>
            <button onclick="analyze()" id="btn">分析</button>
        </div>

        <div class="grid-3">
            <div class="card">
                <div class="card-title">最新價格與漲跌</div>
                <div class="card-value" id="price">--</div>
                <div class="card-change" id="priceChange">--</div>
                <div class="detail-list" id="priceDetail">--</div>
            </div>
            <div class="card">
                <div class="card-title">新聞情緒</div>
                <div class="card-value" id="sentiment">--</div>
                <div class="card-change" id="sentimentText">--</div>
            </div>
            <div class="card">
                <div class="card-title">RSI</div>
                <div class="card-value" id="rsi">--</div>
                <div class="card-change" id="rsiText">--</div>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-header">
                <div class="chart-title">歷史價格與指標 (1Y)</div>
                <div class="tabs">
                    <button class="indicator-toggle" data-subchart="macd">MACD</button>
                    <button class="indicator-toggle" data-subchart="rsi">RSI</button>
                    <button class="indicator-toggle" data-subchart="kd">KD</button>
                    <button class="indicator-toggle" data-subchart="bias">BIAS</button>
                    <button class="indicator-toggle" data-subchart="ad">AD</button>
                </div>
            </div>
            <div id="mainChart" style="height: 540px;"></div>
            <div id="subChartsArea" class="subcharts-area" style="display: none;"></div>
        </div>

        <div class="two-col">
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">Company Overview</div>
                </div>
                <div class="overview-grid" id="companyOverview">
                    <div><span class="label">載入中:</span> --</div>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">ML Predictions</div>
                </div>
                <div class="training-row">
                    <div id="trainingStatus"><span class="dot running"></span>Training...</div>
                    <div id="forecastPrice">--</div>
                </div>
                <div class="horizon-tabs" id="horizonTabs">
                    <button class="horizon-tab active" data-days="7">7 Days</button>
                    <button class="horizon-tab" data-days="14">14 Days</button>
                    <button class="horizon-tab" data-days="30">30 Days</button>
                </div>
                <div class="model-list" id="modelList"></div>
            </div>
        </div>

        <div class="grid-2">
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">技術指標熱力圖 (漲跌週期)</div>
                </div>
                <div id="indChart" style="height: 300px;"></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">新聞動態</div>
                </div>
                <div id="newsList" style="max-height: 300px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div style="text-align: center;">
            <div class="spinner"></div>
            <div style="margin-top: 1rem;">分析中...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

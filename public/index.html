<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 3rem;
        }
        .header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .card h2 { color: #667eea; margin-bottom: 1rem; }
        .endpoint {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 4px;
            font-family: monospace;
        }
        .demo-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }
        .input-group { margin-bottom: 1rem; }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .result {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.875rem;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            background: #d4edda;
            color: #155724;
        }
        @media (max-width: 768px) {
            .demo-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 StockSense</h1>
            <p style="font-size: 1.2rem; opacity: 0.9;">股票分析 API</p>
            <p style="margin-top: 0.5rem;"><span class="status">✓ 運行中</span></p>
        </div>

        <div class="card">
            <h2>🌐 API 端點</h2>
            <div class="endpoint">
                <div style="font-weight: bold; color: #667eea;">健康檢查</div>
                <div>GET /api/health</div>
            </div>
            <div class="endpoint">
                <div style="font-weight: bold; color: #667eea;">股票查詢</div>
                <div>GET /api/stock_insight?ticker=2330&period=1mo&interval=1d</div>
            </div>
        </div>

        <div class="card">
            <h2>🧪 即時測試</h2>
            <div class="demo-section">
                <div>
                    <div class="input-group">
                        <label>股票代碼</label>
                        <input type="text" id="ticker" value="2330">
                    </div>
                    <div class="input-group">
                        <label>時間範圍</label>
                        <select id="period">
                            <option value="1mo" selected>1 個月</option>
                            <option value="3mo">3 個月</option>
                            <option value="1y">1 年</option>
                        </select>
                    </div>
                    <button class="btn" onclick="fetchStock()">🔍 查詢</button>
                </div>
                <div>
                    <div class="input-group">
                        <label>結果</label>
                        <div class="result" id="result">點擊查詢按鈕測試 API...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchStock() {
            const ticker = document.getElementById('ticker').value;
            const period = document.getElementById('period').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.textContent = '載入中...';
            
            try {
                const url = `/api/stock_insight?ticker=${ticker}&period=${period}&interval=1d`;
                const response = await fetch(url);
                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.textContent = `錯誤：${error.message}`;
            }
        }
    </script>
</body>
</html>
